<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login · MediCare Hospital</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public-extras.css">
<script src="public-extras.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #0d6e9e; --primary-dark: #0a5578; --primary-light: #e1f0f8;
  --success: #0e8b5e; --warning: #e8a33d; --danger: #e84a5f;
  --dark: #0b3b4b; --gray: #5e7e8c; --light-gray: #f5f9fc;
  --border: #e6f0f5; --white: #fff;
  --shadow-lg: 0 20px 50px -12px rgba(0,80,110,0.15);
}
body { font-family: 'Inter', sans-serif; background: var(--light-gray); color: #1e293b; line-height: 1.6; }
a { text-decoration: none; color: inherit; }

.btn { padding: 12px 22px; border-radius: 12px; border: none; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 16px -4px rgba(13,110,158,0.3); }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
.btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--border); }
.btn-outline:hover { background: var(--primary-light); border-color: var(--primary); }
.btn-lg { padding: 16px 30px; font-size: 15px; border-radius: 14px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.auth-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 60px 24px;
  background: linear-gradient(135deg, #0b3b4b 0%, #0d6e9e 100%);
  position: relative; overflow: hidden;
}
.auth-wrap::before { content: ''; position: absolute; width: 600px; height: 600px; background: rgba(255,255,255,0.05); border-radius: 50%; top: -250px; right: -200px; }
.auth-wrap::after  { content: ''; position: absolute; width: 450px; height: 450px; background: rgba(255,255,255,0.04); border-radius: 50%; bottom: -200px; left: -150px; }

.auth-card {
  background: #fff; border-radius: 24px; padding: 40px 36px;
  width: 100%; max-width: 440px;
  box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4);
  position: relative; z-index: 2;
}

.auth-head { text-align: center; margin-bottom: 28px; }
.auth-head .logo-icon {
  background: linear-gradient(135deg, #0b3b4b, #0d6e9e); color: #fff;
  width: 60px; height: 60px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; margin: 0 auto 16px;
  box-shadow: 0 12px 24px -6px rgba(11,59,75,0.4);
}
.auth-head h1 { font-size: 24px; font-weight: 800; color: var(--dark); margin-bottom: 6px; letter-spacing: -0.4px; }
.auth-head p { font-size: 14px; color: var(--gray); }

.auth-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--primary-light); color: var(--primary);
  padding: 6px 14px; border-radius: 40px;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 14px;
}
.auth-badge i { font-size: 12px; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--dark); margin-bottom: 7px; }
.form-group input {
  width: 100%; padding: 13px 15px;
  border: 1.5px solid var(--border); border-radius: 12px;
  font-family: inherit; font-size: 14px; color: var(--dark);
  background: #f9fcfd; outline: none; transition: all .15s;
}
.form-group input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(13,110,158,0.08); }
.form-group.error label { color: var(--danger); }
.form-group.error input { border-color: var(--danger); background: #fff7f8; }

.pass-wrap { position: relative; }
.pass-wrap input { padding-right: 48px; }
.pass-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border: none; background: transparent;
  color: var(--gray); cursor: pointer; border-radius: 9px; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}
.pass-toggle:hover { background: var(--primary-light); color: var(--primary); }

.alert { display: none; align-items: flex-start; gap: 10px; padding: 12px 15px; border-radius: 12px; font-size: 13.5px; font-weight: 500; margin-bottom: 16px; background: #fdecef; color: var(--danger); }
.alert.show { display: flex; }
.alert.success { background: #e1f7ed; color: var(--success); }

.auth-foot { text-align: center; font-size: 13.5px; color: var(--gray); margin-top: 18px; }
.auth-foot a { color: var(--primary); font-weight: 600; cursor: pointer; }
.auth-foot a:hover { text-decoration: underline; }

.divider { display: flex; align-items: center; gap: 14px; margin: 24px 0 16px; color: var(--gray); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.back-link {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 18px; font-size: 13px; color: var(--gray); font-weight: 600;
}
.back-link:hover { color: var(--primary); }

.hidden { display: none !important; }

@media (max-width: 640px) {
  .auth-wrap { padding: 30px 16px; }
  .auth-card { padding: 28px 22px; border-radius: 20px; }
  .auth-head h1 { font-size: 20px; }
}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <!-- ============ LOGIN VIEW ============ -->
    <div id="loginView">
      <div class="auth-head">
        <div class="logo-icon"><i class="fas fa-user-md"></i></div>
        <div class="auth-badge"><i class="fas fa-shield-alt"></i> Staff Area</div>
        <h1>Hospital Dashboard</h1>
        <p>Sign in with your administrator credentials</p>
      </div>

      <div class="alert" id="err"><i class="fas fa-exclamation-circle"></i><span></span></div>

      <form id="adminLoginForm" novalidate>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="adminUser" autocomplete="username" placeholder="e.g. hamza.admin" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="pass-wrap">
            <input type="password" id="adminPass" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="pass-toggle" data-target="adminPass"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">
          <i class="fas fa-sign-in-alt"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="auth-foot">
        First time here? <a id="setupLink">Create admin account</a>
      </div>

      <div class="divider">Patient</div>
      <a href="index.html" class="btn btn-outline btn-block"><i class="fas fa-user"></i> Patient Website</a>

      <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>

    <!-- ============ CREATE ADMIN VIEW ============ -->
    <div id="createView" class="hidden">
      <div class="auth-head">
        <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
        <div class="auth-badge"><i class="fas fa-cog"></i> First-Time Setup</div>
        <h1>Create Admin Account</h1>
        <p>Set up your administrator credentials for this device</p>
      </div>

      <div class="alert" id="createErr"><i class="fas fa-exclamation-circle"></i><span></span></div>

      <form id="createAdminForm" novalidate>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="newUser" autocomplete="username" placeholder="e.g. hamza.admin" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="pass-wrap">
            <input type="password" id="newPass" autocomplete="new-password" placeholder="Min 6 characters" required>
            <button type="button" class="pass-toggle" data-target="newPass"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="pass-wrap">
            <input type="password" id="newPass2" autocomplete="new-password" placeholder="Repeat password" required>
            <button type="button" class="pass-toggle" data-target="newPass2"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">
          <i class="fas fa-check"></i> Create Admin Account
        </button>
      </form>

      <div class="auth-foot">
        Already have an account? <a id="backToLogin">Back to login</a>
      </div>
    </div>

  </div>
</div>

<script>
/* =====================================================
   ADMIN LOGIN + CREATE ADMIN ACCOUNT
   -----------------------------------------------------
   Storage keys (ISOLATED so dashboard data is safe):
     • medicare_admin    → admin credentials (this file)
     • medicare_session  → active session token
     • medicare_hms      → DASHBOARD DATA (untouched!)
===================================================== */
const SALT        = 'medicare::hms::v2::salt';
const DB_KEY      = 'medicare_admin';   // ← credentials ONLY
const SESSION_KEY = 'medicare_session';

async function hashPassword(password) {
  const input = SALT + '|' + password;
  if (window.crypto && window.crypto.subtle && window.isSecureContext) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
      return 'sha256:' + Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) {}
  }
  // Fallback for file:// or insecure contexts
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < input.length; i++) {
    const ch = input.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'fnv:' + (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
}

function loadDB() {
  try { return JSON.parse(localStorage.getItem(DB_KEY)); }
  catch (e) { return null; }
}

// If admin already has session, go straight to dashboard
(function () {
  const raw = sessionStorage.getItem(SESSION_KEY);
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    const db = loadDB();
    if (db && db.user && db.user.username === s.u) {
      location.replace('dashboard.html');
    }
  } catch (e) {}
})();

/* ---------- Elements ---------- */
const loginView  = document.getElementById('loginView');
const createView = document.getElementById('createView');

const errBox       = document.getElementById('err');
const createErrBox = document.getElementById('createErr');

const showErr = (box, m) => {
  box.querySelector('span').textContent = m;
  box.classList.add('show');
};
const hideErr = box => box.classList.remove('show');

const showLogin = () => {
  createView.classList.add('hidden');
  loginView.classList.remove('hidden');
  hideErr(errBox);
  hideErr(createErrBox);
};
const showCreate = () => {
  loginView.classList.add('hidden');
  createView.classList.remove('hidden');
  hideErr(errBox);
  hideErr(createErrBox);
};

/* ---------- Password visibility toggle ---------- */
document.addEventListener('click', e => {
  const btn = e.target.closest('.pass-toggle');
  if (!btn) return;
  const input = document.getElementById(btn.dataset.target);
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.innerHTML = `<i class="fas fa-eye${show ? '-slash' : ''}"></i>`;
});

/* ---------- "Create admin account" link ---------- */
document.getElementById('setupLink').addEventListener('click', e => {
  e.preventDefault();
  const db = loadDB();
  const hasAccount = db && db.user && db.user.username && db.user.passwordHash;
  if (hasAccount) {
    showErr(errBox, 'An admin account already exists on this device. Please sign in.');
    return;
  }
  showCreate();
});

/* ---------- "Back to login" link ---------- */
document.getElementById('backToLogin').addEventListener('click', e => {
  e.preventDefault();
  showLogin();
});

/* ---------- LOGIN submit ---------- */
document.getElementById('adminLoginForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideErr(errBox);
  document.querySelectorAll('#loginView .form-group.error').forEach(g => g.classList.remove('error'));

  const username = document.getElementById('adminUser').value.trim();
  const password = document.getElementById('adminPass').value;

  if (!username) {
    document.getElementById('adminUser').closest('.form-group').classList.add('error');
    return showErr(errBox, 'Please enter your username.');
  }
  if (!password) {
    document.getElementById('adminPass').closest('.form-group').classList.add('error');
    return showErr(errBox, 'Please enter your password.');
  }

  const db = loadDB();
  if (!db || !db.user || !db.user.username) {
    return showErr(errBox, 'No admin account found. Click "Create admin account" below.');
  }

  if (username.toLowerCase() !== db.user.username.toLowerCase()) {
    document.getElementById('adminUser').closest('.form-group').classList.add('error');
    document.getElementById('adminPass').closest('.form-group').classList.add('error');
    return showErr(errBox, 'Invalid username or password.');
  }

  const btn = e.target.querySelector('button[type="submit"]');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

  const hash = await hashPassword(password);
  const ok = hash === db.user.passwordHash;

  btn.disabled = false;
  btn.innerHTML = orig;

  if (!ok) {
    document.getElementById('adminPass').value = '';
    document.getElementById('adminUser').closest('.form-group').classList.add('error');
    document.getElementById('adminPass').closest('.form-group').classList.add('error');
    return showErr(errBox, 'Invalid username or password.');
  }

  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ u: db.user.username, t: Date.now() }));
  location.replace('dashboard.html');
});

/* ---------- CREATE ADMIN submit ---------- */
document.getElementById('createAdminForm').addEventListener('submit', async e => {
  e.preventDefault();
  hideErr(createErrBox);
  document.querySelectorAll('#createView .form-group.error').forEach(g => g.classList.remove('error'));

  const u  = document.getElementById('newUser').value.trim();
  const p  = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;

  if (!u) {
    document.getElementById('newUser').closest('.form-group').classList.add('error');
    return showErr(createErrBox, 'Please enter a username.');
  }
  if (u.length < 3) {
    document.getElementById('newUser').closest('.form-group').classList.add('error');
    return showErr(createErrBox, 'Username must be at least 3 characters.');
  }
  if (p.length < 6) {
    document.getElementById('newPass').closest('.form-group').classList.add('error');
    return showErr(createErrBox, 'Password must be at least 6 characters.');
  }
  if (p !== p2) {
    document.getElementById('newPass').closest('.form-group').classList.add('error');
    document.getElementById('newPass2').closest('.form-group').classList.add('error');
    return showErr(createErrBox, 'Passwords do not match.');
  }

  const existing = loadDB();
  if (existing && existing.user && existing.user.username) {
    return showErr(createErrBox, 'An admin account already exists. Please sign in instead.');
  }

  const btn = e.target.querySelector('button[type="submit"]');
  const orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

  const passwordHash = await hashPassword(p);

  // ✅ Saves ONLY credentials to 'medicare_admin'
  //    'medicare_hms' (your dashboard dummy data) is NOT touched.
  localStorage.setItem(DB_KEY, JSON.stringify({
    user: { username: u, passwordHash },
    createdAt: Date.now()
  }));

  btn.disabled = false;
  btn.innerHTML = orig;

  document.getElementById('adminUser').value = u;
  document.getElementById('adminPass').value = '';
  showLogin();
  hideErr(errBox);
  errBox.classList.add('success');
  showErr(errBox, 'Admin account created! Please sign in with your new password.');
  setTimeout(() => errBox.classList.remove('success'), 4000);
});
</script>
</body>
</html>
